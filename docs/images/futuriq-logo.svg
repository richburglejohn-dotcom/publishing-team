<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 200" role="img" aria-labelledby="futuriqLogoTitle">
  <title id="futuriqLogoTitle">FuturIQ — AI-Assisted Publishing</title>
  <defs>
    <radialGradient id="fiqMarkBg" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#2a1e18"/>
      <stop offset="100%" stop-color="#1a1614"/>
    </radialGradient>
    <linearGradient id="fiqFlame" x1="0%" y1="100%" x2="60%" y2="0%">
      <stop offset="0%" stop-color="#a6182c"/>
      <stop offset="100%" stop-color="#d1233a"/>
    </linearGradient>
    <linearGradient id="fiqLetter" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ede4d3"/>
      <stop offset="100%" stop-color="#b8ac96"/>
    </linearGradient>
  </defs>

  <!-- Mark: gaslamp roundel -->
  <g transform="translate(100,100)">
    <circle r="86" fill="url(#fiqMarkBg)" stroke="#c9973f" stroke-width="2" stroke-opacity="0.65"/>
    <circle r="78" fill="none" stroke="#c9973f" stroke-width="1" stroke-opacity="0.3"/>

    <!-- Flame accent -->
    <g transform="translate(-2,-30) scale(0.7)">
      <path d="M -3,-62
               C 10,-50 16,-40 9,-30
               C 18,-33 24,-26 21,-17
               C 26,-19 29,-13 26,-7
               C 21,4 6,7 -4,2
               C -16,-4 -19,-16 -12,-25
               C -18,-25 -21,-33 -15,-40
               C -12,-44 -13,-49 -9,-54
               C -7,-57 -5,-60 -3,-62 Z"
            fill="url(#fiqFlame)"/>
    </g>

    <!-- Letterform: F -->
    <path d="M -30,-2
             L -30,54
             L -12,54
             L -12,30
             L 14,30
             L 14,14
             L -12,14
             L -12,-2
             L 22,-2
             L 22,-18
             L -30,-18 Z"
          fill="url(#fiqLetter)"/>
  </g>

  <!-- Wordmark -->
  <text x="216" y="98" font-family="'Playfair Display', Georgia, 'Times New Roman', serif" font-style="italic" font-weight="600" font-size="54" fill="#ede4d3">Futur<tspan fill="#c9973f">IQ</tspan></text>
  <text x="218" y="128" font-family="'Courier Prime', 'Courier New', monospace" font-size="15" letter-spacing="3" fill="#b8ac96">AI-ASSISTED PUBLISHING</text>
</svg>
